<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예약 문의함</title>
<style>
:root{--paper:#FBEDE4;--surface:#FFF8F4;--ink:#3A2219;--soft:#75564A;--berry:#8E3B5A;--line:rgba(58,34,25,.16);--focus:#1F5FBF}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:40rem;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.375rem;margin:0 0 20px}
.login{background:var(--surface);border-radius:16px;padding:24px}
.login label{display:block;font-weight:600;margin-bottom:8px}
.login input{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:14px;background:#fff}
button{font:inherit;cursor:pointer}
.btn{min-height:50px;padding:0 20px;border:0;border-radius:999px;background:var(--berry);color:#fff;font-weight:600;width:100%}
.err{color:#A3271F;margin:12px 0 0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.count{font-size:2.5rem;font-weight:700;line-height:1}
.count small{font-size:1rem;font-weight:500;color:var(--soft);margin-left:6px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;min-height:40px;padding:0 14px;color:var(--ink)}
.card{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid transparent}
.card.new{border-color:var(--berry)}
.meta{color:var(--soft);font-size:.9375rem}
.name{font-weight:700;font-size:1.125rem}
.contact{display:inline-block;margin:4px 0;padding:6px 0;background:none;border:0;color:var(--ink);text-decoration:underline;font-weight:500}
.svc{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--paper);font-size:.9375rem}
.st{display:flex;gap:8px;margin-top:12px}
.st button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.st button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{color:var(--soft);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>예약 문의함</h1>

  <form class="login" id="login">
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <div id="box" hidden>
    <div class="head">
      <div class="count"><span id="new-count">0</span><small>건의 새 문의</small></div>
      <button class="ghost" id="reload" type="button">새로고침</button>
    </div>
    <p class="err" id="box-err" role="alert"></p>
    <div id="list"></div>
  </div>
</div>

<script>
var KEY='admin-pw', STATUSES=['새 문의','연락함','완료'];
var $=function(id){return document.getElementById(id);};
function pw(){try{return sessionStorage.getItem(KEY)||'';}catch(e){return window.__pw||'';}}
function setPw(v){try{sessionStorage.setItem(KEY,v);}catch(e){window.__pw=v;}}
function clearPw(){try{sessionStorage.removeItem(KEY);}catch(e){} window.__pw='';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function when(t){var d=new Date(t);return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}

async function api(method, body){
  var r=await fetch('/api/admin',{method:method,headers:{'x-admin-password':pw(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  var d=await r.json().catch(function(){return {};});
  if(r.status===401){clearPw();showLogin('비밀번호가 맞지 않아요.');throw 0;}
  if(!r.ok){$('box-err').textContent=d.error||'불러오지 못했어요.';throw 0;}
  $('box-err').textContent='';
  return d;
}
function showLogin(msg){$('box').hidden=true;$('login').hidden=false;$('login-err').textContent=msg||'';$('pw').value='';$('pw').focus();}

function render(rows){
  $('new-count').textContent=rows.filter(function(r){return r.status==='새 문의';}).length;
  if(!rows.length){$('list').innerHTML='<p class="empty">아직 들어온 문의가 없어요.</p>';return;}
  $('list').innerHTML=rows.map(function(r){
    return '<article class="card'+(r.status==='새 문의'?' new':'')+'">'+
      '<div class="meta">'+esc(when(r.created_at))+'</div>'+
      '<div><span class="name">'+esc(r.name)+'</span>'+(r.service?'<span class="svc">'+esc(r.service)+'</span>':'')+'</div>'+
      '<button class="contact" type="button" data-copy="'+esc(r.contact)+'">'+esc(r.contact)+'</button>'+
      '<div class="st" role="group" aria-label="처리 상태">'+STATUSES.map(function(s){
        return '<button type="button" data-id="'+r.id+'" data-s="'+s+'" aria-pressed="'+(r.status===s)+'">'+s+'</button>';
      }).join('')+'</div></article>';
  }).join('');
}
async function load(){try{var d=await api('GET');$('login').hidden=true;$('box').hidden=false;render(d.rows||[]);}catch(e){}}

$('login').addEventListener('submit',function(e){e.preventDefault();setPw($('pw').value);load();});
$('reload').addEventListener('click',load);
$('list').addEventListener('click',async function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy!==undefined){
    var t=b.dataset.copy;
    try{await navigator.clipboard.writeText(t);var o=b.textContent;b.textContent='복사했어요';setTimeout(function(){b.textContent=o;},1200);}
    catch(err){var rg=document.createRange();rg.selectNodeContents(b);var s=getSelection();s.removeAllRanges();s.addRange(rg);}
    return;
  }
  if(b.dataset.s){try{await api('PATCH',{id:Number(b.dataset.id),status:b.dataset.s});load();}catch(err){}}
});
if(pw()) load(); else $('pw').focus();
</script>
</body>
</html>
